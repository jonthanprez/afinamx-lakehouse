name: Data Lakehouse CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar Python 3.11
        run: uv python install 3.11

      - name: Instalar dependencias de Linting
        run: uv sync --group dev

      - name: Validar Formato Python (Ruff)
        run: uv run ruff format --check .

      - name: Ejecutar Linter Python (Ruff)
        run: uv run ruff check .

      - name: Escaneo de Secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dag-integrity-testing:
    name: Airflow DAG Integrity & Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality-and-security

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar Python 3.11
        run: uv python install 3.11

      - name: Instalar dependencias de Airflow y pruebas
        run: |
          uv sync --group dev
          uv pip install "apache-airflow==2.8.1"

      - name: Ejecutar Pruebas de Integridad de DAGs (Pytest)
        run: uv run pytest tests/ -v
